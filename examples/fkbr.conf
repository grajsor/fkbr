# Optional fkbr node configuration: everything here can also be given as
# flags (-node, -share, -root, -roles, -state). fkbr reads it from -config,
# else $FKBR_CONFIG, else fkbr.conf next to the binary, else ~/.fkbr.conf
# (only these, in this order); flags override it.

# Local API socket for CLI/TUI (default <state_dir>/fkbr.sock, max 100
# bytes) and its permissions (0660 lets the node user's group use it).
# socket: /tmp/fkbr-1000-hosta/fkbr.sock
# socket_mode: 0600

# Unique per node; becomes a directory name on the share.
node_id: hosta

# The shared NFS directory. Must be the same export on every node.
nfs_root: /mnt/transfer/fkbr
# NFS attribute caching: auto (default) works around long caching
# (actimeo) when the mount options call for it; always or never.
# nfs_refresh: auto

# Or no share: the hosts to link over ssh (docs/ssh.md), host or
# host:/dir to share there, as ssh takes the host; NAME=host:/dir names
# its node (default: its short hostname). Not with nfs_root.
# F7 and F8 in the TUI's node list add and remove entries here.
# ssh: [web01:/srv/www, db01]
# fkbr on those hosts (default: fkbr on their PATH); ~/ is their home.
# ssh_bin: ~/fkbr/fkbr

# Root "local": a directory only this host's TUI and CLI see (default /;
# none: no such root). Other nodes cannot reach it.
# local_root: /

# Local runtime dir (never NFS) for the worker lock and socket; removed on
# clean exit. Default: /tmp/fkbr-<uid>-<node> (kept fresh while running, so
# /tmp cleaners leave it alone; not /run/user, which logout deletes). It
# must belong to the user running fkbr and not be writable by others.
# state_dir: /tmp/fkbr-1000-hosta

# Role tags, published to the registry. "@role" targets every node with the
# role (fkbr cp data/x @slave:data), and accept_writes_from can name roles.
roles: [master]

# Who may initiate writes into this node: node IDs and/or @roles. Empty or
# absent: anyone. A node may always pull into itself. On a slave e.g.:
# accept_writes_from: ["@master"]

# Local directories this node exposes. Default (no roots here, no -root):
# the directory fkbr is started in, as root "files". Peers address files
# as node:/path, or node:root-id/path when a node has several roots.
roots:
  - id: appdata
    path: /opt/application/data
    allow_write: true
  - id: logs
    path: /var/log/application
    allow_write: false

# Defaults shown.
# poll:
#   active: 200ms      # inbox/reply polling while busy
#   idle: 1s           # ... after idle_after without traffic
#   idle_after: 30s
# heartbeat_interval: 5s
# offline_after: 30s   # heartbeat age (NFS server clock) => node offline
# request_timeout: 30s
# keep_done: 1h        # how long finished jobs, sync plans and failed
#                      # requests stay on the share (pruned by running nodes)
# forget_after: 168h   # nodes offline this long are removed from the
#                      # registry by running nodes (-1: never)

# Sync (defaults shown).
# sync:
#   max_deletes: 1000      # per target; more needs an explicit force

# The TUI's own settings (defaults shown); F11 in the TUI changes them.
# tui:
#   colors: auto           # auto, true, 256, 16 or none (-colors wins)
#   mouse: true            # false leaves the mouse to the terminal (-mouse wins)
#   if_exists: skip        # what F5/F6 start with: skip, overwrite-if-older, overwrite
#   compress: false        # F5/F6/F4 start with zstd on
#   exclude: ""            # what the exclude field starts with: ".git *.tmp"

# Transfers (defaults shown). Staging is chunked and bounded because the
# share's free space may be smaller than what you copy.
# transfer:
#   chunk_size: 128MiB     # largest staged chunk, at most 1GiB (the first ones are smaller: 4, 8, 16 MiB ...)
#                          # (over ssh: 32MiB)
#   job_quota: 1GiB        # max bytes this node stages for one job (over ssh: 128MiB)
#   staging_quota: 4GiB    # max bytes this node stages for all jobs
#                          # (on an ssh home node: also on every host it links)
#   max_jobs: 2            # concurrent sending jobs, and receiving jobs
#   allow_setid: false     # keep setuid/setgid bits on received files
#   detach_after: 10m      # fan-out: drop a target stalled this long; a copy
#                          # fails if the share stays full this long
